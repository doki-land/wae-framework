[package]
name = "wae"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "readme.md"
description = "WAE Rust 门面库：统一导出 N-API / WebView / dist 与过程宏"
publish = false

[features]
default = ["dist", "webview"]
## 导出 `wae-dist` 暂存 API
dist = ["dep:wae-dist"]
## 导出 `wae-webview-win32`（非 Windows 上为 stub / 错误类型）
webview = ["dep:wae-webview-win32"]

[dependencies]
wae-napi = { path = "../wae-napi" }
wae-macros = { path = "../wae-macros" }
wae-dist = { path = "../wae-dist", optional = true }
wae-webview-win32 = { path = "../wae-webview-win32", optional = true }
