[package]
name = "wae"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "readme.md"
description = "WAE Rust 门面库：统一导出 N-API / WebView 与过程宏"
publish = false

[features]
default = ["webview", "shell", "audit", "plugins", "harness", "installer"]
## 导出 `wae::webview`（按编译目标选择平台后端）
webview = ["dep:binding-webview", "dep:binding-webview-win32", "dep:binding-webview-macos", "dep:binding-webview-linux"]
## 导出 `wae::shell`（系统关联程序启动文件）
shell = ["dep:wae-shell"]
## 导出 `wae::audit`（审计记录与查询）
audit = ["dep:wae-audit"]
## 导出 `wae::plugins`（声明式插件宿主）
plugins = ["dep:wae-plugins"]
## 导出 `wae::harness`（进程内自动化与 loopback 控制通道）
harness = ["dep:wae-harness", "webview"]
## 导出 `wae::installer`（进程内 OS 安装包封装：MSI / deb / rpm / MSIX）
installer = ["dep:wae-installer"]

[dependencies]
wae-napi = { path = "../wae-napi" }
wae-macros = { path = "../wae-macros" }
binding-webview = { workspace = true, optional = true }
wae-shell = { path = "../wae-shell", optional = true }
wae-audit = { path = "../wae-audit", optional = true }
wae-plugins = { path = "../wae-plugins", optional = true }
wae-harness = { path = "../wae-harness", optional = true }
wae-installer = { path = "../wae-installer", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
binding-webview-win32 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
binding-webview-macos = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
binding-webview-linux = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
