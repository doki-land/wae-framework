[package]
name = "wae"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "readme.md"
description = "WAE Rust 门面库：统一导出 N-API / WebView / dist 与过程宏"
publish = false

[features]
default = ["dist", "webview"]
## 导出 `wae-dist` 暂存 API
dist = ["dep:wae-dist"]
## 导出 `wae::webview`（按编译目标选择平台后端）
webview = ["dep:wae-webview", "dep:wae-webview-win32", "dep:wae-webview-macos", "dep:wae-webview-linux"]

[dependencies]
wae-napi = { path = "../wae-napi" }
wae-macros = { path = "../wae-macros" }
wae-dist = { path = "../wae-dist", optional = true }
wae-webview = { path = "../wae-webview", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wae-webview-win32 = { path = "../wae-webview-win32", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wae-webview-macos = { path = "../wae-webview-macos", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wae-webview-linux = { path = "../wae-webview-linux", optional = true }
