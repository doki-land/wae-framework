<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Cleaner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --panel: #1a1e27;
      --ink: #e8ecf4;
      --muted: #8b93a7;
      --line: #2a3140;
      --accent: #3dd68c;
      --warn: #f0b429;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
      -webkit-app-region: drag; app-region: drag;
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .spacer { flex: 1; }
    header input, header button { -webkit-app-region: no-drag; app-region: no-drag; }
    input {
      width: min(420px, 48vw); border: 1px solid var(--line); background: #0e1117;
      color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px; background: var(--accent);
      color: #062416; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--line); border-bottom: 1px solid var(--line);
    }
    .stat { background: var(--panel); padding: 12px 14px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { margin-top: 4px; font-size: 20px; font-variant-numeric: tabular-nums; }
    .status { padding: 8px 14px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
    .status.err { color: #ff7b72; }
    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { position: sticky; top: 0; background: #151922; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .bytes { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--warn); }
    .kind { color: var(--accent); }
    .path { word-break: break-all; color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <div class="brand">Open Cleaner</div>
    <input id="root" placeholder="扫描目录（空=系统临时目录）" />
    <button id="scanBtn" type="button">重新扫描</button>
    <div class="spacer"></div>
    <button class="ghost" id="closeBtn" type="button">关闭</button>
  </header>
  <section class="stats">
    <div class="stat"><div class="label">合计</div><div class="value" id="total">—</div></div>
    <div class="stat"><div class="label">条目</div><div class="value" id="count">—</div></div>
    <div class="stat"><div class="label">根目录</div><div class="value" id="rootLabel" style="font-size:13px;word-break:break-all">—</div></div>
  </section>
  <div class="status" id="status">正在扫描…</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>类型</th><th>大小</th><th>路径</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script>
    const rows = document.getElementById('rows');
    const status = document.getElementById('status');
    const rootInput = document.getElementById('root');
    const scanBtn = document.getElementById('scanBtn');
    const closeBtn = document.getElementById('closeBtn');
    const totalEl = document.getElementById('total');
    const countEl = document.getElementById('count');
    const rootLabel = document.getElementById('rootLabel');
    let seq = 0;

    function formatBytes(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 ** 2) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1024 ** 3) return (n / 1024 ** 2).toFixed(1) + ' MB';
      return (n / 1024 ** 3).toFixed(2) + ' GB';
    }

    function post(msg) {
      const bridge = window.chrome && window.chrome.webview;
      if (!bridge || !bridge.postMessage) {
        status.className = 'status err';
        status.textContent = '原生桥接不可用（不在 WebView2 宿主中）';
        return false;
      }
      bridge.postMessage(JSON.stringify(msg));
      return true;
    }

    function render(report) {
      rows.innerHTML = '';
      for (const entry of report.entries || []) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="kind">' + entry.kind + '</td>' +
          '<td class="bytes">' + formatBytes(entry.bytes) + '</td>' +
          '<td class="path">' + entry.path + '</td>';
        rows.appendChild(tr);
      }
      totalEl.textContent = formatBytes(report.totalBytes || 0);
      countEl.textContent = String((report.entries || []).length);
      rootLabel.textContent = report.root || '—';
      status.className = 'status';
      status.textContent = '扫描完成';
    }

    function doScan() {
      const id = ++seq;
      scanBtn.disabled = true;
      status.className = 'status';
      status.textContent = '正在扫描…';
      const root = rootInput.value.trim();
      if (!post({ type: 'scan', id, root: root || undefined })) {
        scanBtn.disabled = false;
      }
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', (event) => {
        let data = event.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (_) { return; }
        }
        if (!data || typeof data !== 'object') return;
        if (data.type === 'scanResult') {
          scanBtn.disabled = false;
          render(data.report);
        } else if (data.type === 'scanError') {
          scanBtn.disabled = false;
          status.className = 'status err';
          status.textContent = '扫描失败：' + data.message;
        }
      });
    }

    scanBtn.addEventListener('click', doScan);
    closeBtn.addEventListener('click', () => post({ type: 'close' }));
    // Open = immediately scan. The window exists to show results, not a blank HTML page.
    doScan();
  </script>
</body>
</html>
