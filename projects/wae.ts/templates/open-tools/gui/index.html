<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{name}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --panel: #1a1e27;
      --ink: #e8ecf4;
      --muted: #8b93a7;
      --line: #2a3140;
      --accent: #3dd68c;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { display: flex; flex-direction: column; align-items: stretch; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
      -webkit-app-region: drag; app-region: drag;
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header .spacer { flex: 1; }
    header button { -webkit-app-region: no-drag; app-region: no-drag; }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px; background: var(--accent);
      color: #062416; font: inherit; font-weight: 700; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    main { padding: 24px 14px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="brand">{{name}}</div>
    <div class="spacer"></div>
    <button class="ghost" id="closeBtn" type="button">Close</button>
  </header>
  <main>
    Replace this page with your tool UI. The host posts IPC through
    <code>chrome.webview</code> when running inside the Win32 WebView2 shell.
  </main>
  <script>
    const closeBtn = document.getElementById('closeBtn');
    function post(msg) {
      const bridge = window.chrome && window.chrome.webview;
      if (!bridge || !bridge.postMessage) return false;
      bridge.postMessage(JSON.stringify(msg));
      return true;
    }
    closeBtn.addEventListener('click', () => post({ type: 'close' }));
  </script>
</body>
</html>
