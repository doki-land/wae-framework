[workspace]
resolver = "2"
members = [
    "projects/wae.rs/crates/wae",
    "projects/wae.rs/crates/wae-addon",
    "projects/wae.rs/crates/wae-macros",
    "projects/wae.rs/crates/wae-napi",
    "projects/wae.rs/crates/wae-webview",
    "projects/wae.rs/crates/wae-webview-win32",
    "projects/wae.rs/crates/wae-webview-macos",
    "projects/wae.rs/crates/wae-webview-linux",
    "projects/wae.rs/crates/wae-audit",
]
default-members = [
    "projects/wae.rs/crates/wae",
    "projects/wae.rs/crates/wae-addon",
    "projects/wae.rs/crates/wae-macros",
    "projects/wae.rs/crates/wae-napi",
    "projects/wae.rs/crates/wae-webview",
    "projects/wae.rs/crates/wae-webview-win32",
    "projects/wae.rs/crates/wae-webview-macos",
    "projects/wae.rs/crates/wae-webview-linux",
    "projects/wae.rs/crates/wae-audit",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
authors = ["WAE Team <team@wae.dev>"]
repository = "https://github.com/doki-land/wae-framework"

[workspace.dependencies]
thiserror = "2"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
