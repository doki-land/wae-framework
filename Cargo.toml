[workspace]
resolver = "2"
members = [
    "projects/wae.rs/crates/wae",
    "projects/wae.rs/crates/wae-addon",
    "projects/wae.rs/crates/wae-macros",
    "projects/wae.rs/crates/wae-napi",
    "projects/wae.rs/crates/wae-shell",
    "projects/wae.rs/crates/wae-harness",
    "projects/wae.rs/crates/wae-audit",
    "projects/wae.rs/crates/wae-plugins",
    "projects/wae.rs/crates/wae-installer",
]
default-members = [
    "projects/wae.rs/crates/wae",
    "projects/wae.rs/crates/wae-addon",
    "projects/wae.rs/crates/wae-macros",
    "projects/wae.rs/crates/wae-napi",
    "projects/wae.rs/crates/wae-shell",
    "projects/wae.rs/crates/wae-harness",
    "projects/wae.rs/crates/wae-audit",
    "projects/wae.rs/crates/wae-plugins",
    "projects/wae.rs/crates/wae-installer",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "Apache-2.0"
authors = ["WAE Team <team@wae.dev>"]
repository = "https://github.com/doki-land/wae-framework"

[workspace.dependencies]
thiserror = "2"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外部绑定层（boost-binding.rs）：WebView 门面，按完整 rev 钉住
webview = { git = "https://github.com/oovm/boost-binding.rs.git", rev = "610e1879ac6083b426fa7def8dc75d3512dd05cb" }
webview-types = { git = "https://github.com/oovm/boost-binding.rs.git", rev = "610e1879ac6083b426fa7def8dc75d3512dd05cb" }

[profile.release]
lto = true
panic = "abort"
