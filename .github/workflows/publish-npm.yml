name: publish-npm

# Real `@wae/*` versions publish only through the npm Trusted Publisher (OIDC).
# Tag pushes are the normal path. `workflow_dispatch` exists for an explicit,
# user-authorized retry and must name an existing release tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.0.1). It must match every package version."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Native addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build and stage the native addon
        run: node --experimental-strip-types scripts/build-napi.ts
      - name: Require the staged addon and call a capability
        run: node --experimental-strip-types scripts/smoke-native.ts
      - uses: actions/upload-artifact@v5
        with:
          name: wae-${{ matrix.target }}
          path: projects/wae.ts/packages/platforms/wae-${{ matrix.target }}/wae.${{ matrix.target }}.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: projects/wae.ts/packages/platforms
          pattern: wae-*
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for Trusted Publisher support
        run: npm install --global npm@11
      - name: Install
        # 本仓不提交 pnpm-lock.yaml，禁止 frozen-lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build:ts
      - name: Verify tag, npm versions, and Cargo workspace version
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          pnpm exec wae publish \
            --dir projects/wae.ts/packages/wae \
            --dir projects/wae.ts/packages/wae-commander \
            --dir projects/wae.ts/packages/platforms/wae-win32-x64 \
            --dir projects/wae.ts/packages/platforms/wae-darwin-arm64 \
            --dir projects/wae.ts/packages/platforms/wae-linux-x64 \
            --tag "${RELEASE_TAG}" \
            --cargo Cargo.toml
      - name: Publish via Trusted Publisher (OIDC)
        run: |
          pnpm exec wae publish \
            --dir projects/wae.ts/packages/wae \
            --dir projects/wae.ts/packages/wae-commander \
            --dir projects/wae.ts/packages/platforms/wae-win32-x64 \
            --dir projects/wae.ts/packages/platforms/wae-darwin-arm64 \
            --dir projects/wae.ts/packages/platforms/wae-linux-x64 \
            --tag "${RELEASE_TAG}" \
            --cargo Cargo.toml \
            --ci
