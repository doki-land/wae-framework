name: publish-npm

# 手动闸门：对调用方提供的 npm 包目录执行 `wae publish`（默认 dry-run）。
on:
  workflow_dispatch:
    inputs:
      dirs:
        description: "逗号分隔的 npm 包目录（相对仓库根）"
        required: true
        type: string
      execute:
        description: "真正执行 npm publish"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build:ts
      - name: wae publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=()
          IFS=',' read -ra DIRS <<< "${{ inputs.dirs }}"
          for d in "${DIRS[@]}"; do
            d="$(echo "$d" | xargs)"
            ARGS+=(--dir "$d")
          done
          if [ "${{ inputs.execute }}" = "true" ]; then
            pnpm exec wae publish "${ARGS[@]}" --execute
          else
            pnpm exec wae publish "${ARGS[@]}"
          fi
