name: publish-npm

# Trusted Publisher contract (sole npm trusted workflow — keep this filename):
#   file = publish-npm.yml
#   repo = doki-land/wae-framework
#   env  = NPM_PUBLISH
#
# Real `@wae/*` versions publish only through the npm Trusted Publisher (OIDC).
# Tag pushes are the normal path. `workflow_dispatch` is an explicit,
# user-authorized retry and must name an existing release tag; the version is
# taken from that tag, never from branch HEAD.
#
# Publishing is delegated to Nifty (`nifty publish --version`), the same path
# VMZ uses. Do not reintroduce a second publish implementation here.
#
# The published set is explicit. Native platform addons (which do not exist on
# the registry yet and therefore have no Trusted Publisher record) join the set
# from their own release line, together with the staged artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.0.1). Its version is published."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Leave npm auth unset here: a placeholder token in the runner npmrc
          # blocks Trusted Publisher OIDC.
          package-manager-cache: false
      - name: Upgrade npm for Trusted Publisher support
        run: npm install --global npm@11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:ts
      - name: Publish packages to npm
        run: pnpm exec nifty publish --access public --version="${RELEASE_TAG#v}" --package @wae/wae --package @wae/commander
